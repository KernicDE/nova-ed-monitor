# NOVA Voicelines — English
# Copy this file to ~/.config/nova/voicelines/en.toml and edit freely.
# Each [EventKey] section contains a "lines" array of variants.
# NOVA picks one at random each time the event fires.
# Delete all but one line per event to disable random selection.
# Variables in {curly_braces} are replaced at runtime (see comments above each section).

# ── Startup / Shutdown ────────────────────────────────────────────────────────

[Nova_Startup]
# No variables.
lines = [
    "NOVA active.",
    "NOVA online. All systems nominal.",
    "Navigation, Operations, and Vessel Assistance — online.",
    "NOVA standing by, Commander.",
    "Systems nominal. NOVA ready.",
]

[Shutdown]
# No variables.
lines = [
    "Systems powering down. Farewell, Commander.",
    "Shutting down. Safe travels, Commander.",
    "NOVA going offline. Fly safe.",
    "Powering down. Until next time, Commander.",
]

# ── Login ─────────────────────────────────────────────────────────────────────

[LoadGame]
# {commander} = Commander name
lines = [
    "Commander {commander} online.",
    "Welcome back, Commander {commander}.",
    "NOVA ready. Good to have you back, Commander {commander}.",
    "Online. Greetings, Commander {commander}.",
]

# ── Navigation ────────────────────────────────────────────────────────────────

[FSDJump]
# {system}  = destination star system name
# {dist_ly} = jump distance formatted for speech (e.g. "12.3 light years")
# {suffix}  = optional extra info appended (star class, hops remaining, population)
lines = [
    "Arrived in {system}. Jump {dist_ly}.{suffix}",
    "Hyperspace complete. Welcome to {system}. {dist_ly}.{suffix}",
    "Jump complete. Entering {system}. Distance: {dist_ly}.{suffix}",
    "We have arrived in {system}. Jump distance: {dist_ly}.{suffix}",
    "FSD cooldown complete. Now in {system}.{suffix}",
]

[NavRoute]
# {dest}      = destination system name
# {hops}      = number of jumps
# {hops_word} = "jump" or "jumps"
# {dist_ly}   = total route distance formatted (e.g. "347.2 light years")
lines = [
    "Route set. Destination: {dest}. {hops} {hops_word}.",
    "Navigation route plotted. {dest} in {hops} {hops_word}.",
    "Course laid in. {hops} {hops_word} to {dest}.",
    "Route confirmed. {hops} {hops_word} to {dest}.",
]

[NavRouteClear]
# No variables.
lines = [
    "Route cleared.",
    "Navigation route cancelled.",
    "Route data cleared.",
]

[SupercruiseEntry]
# No variables.
lines = [
    "Entering supercruise.",
    "Supercruise engaged.",
    "Frame Shift Drive — supercruise mode.",
    "Supercruise active.",
]

