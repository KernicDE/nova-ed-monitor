# NOVA Voicelines — Français (standard intégré)
# ─────────────────────────────────────────────
# Chaque événement a exactement une ligne. Pour ajouter des variantes ou
# remplacer un événement, créez ~/.config/nova/voicelines/fr.toml avec
# uniquement les événements à modifier.
# Les variables en {accolades} sont remplacées à l'exécution.

[Nova_Startup]
