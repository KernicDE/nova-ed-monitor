# NOVA Voicelines — English (built-in default)
# ─────────────────────────────────────────────
# THIS FILE IS REPLACED ON EVERY NOVA UPDATE — do not edit it directly.
#
# To customise voicelines, create:
#   ~/.config/nova/voicelines/en.toml
#
# User file format  (add or replace lines per event):
#
#   [EventKey]
#   add     = ["Extra variant 1.", "Extra variant 2."]
#   # OR
#   replace = ["Only this.", "Or this."]
#
#   add     — appends your lines to the built-in pool (more random variety)
#   replace — uses only your lines for this event (overrides the default)
#   replace = []  — silences the event completely
#
# Variables in {curly_braces} are filled at runtime; see each event below.

# ── Startup / Shutdown ────────────────────────────────────────────────────────

[Nova_Startup]
# No variables.
lines = ["NOVA active."]

[Shutdown]
# No variables.
lines = ["Systems powering down. Farewell, Commander."]

# ── Login ─────────────────────────────────────────────────────────────────────

[LoadGame]
# {commander} = Commander name
lines = ["Commander {commander} online."]

# ── Navigation ────────────────────────────────────────────────────────────────

[FSDJump]
# {system}  = destination star system name
# {dist_ly} = jump distance formatted for speech (e.g. "12.3 light years")
# {suffix}  = optional extra info appended (star class, hops remaining, population)
lines = ["Arrived in {system}. Jump {dist_ly}.{suffix}"]

[NavRoute]
# {dest}      = destination system name
# {hops}      = number of jumps
# {hops_word} = "jump" or "jumps"
lines = ["Route set. Destination: {dest}. {hops} {hops_word}."]

[NavRouteClear]
# No variables.
lines = ["Route cleared."]

[SupercruiseEntry]
# No variables.
lines = ["Supercruise engaged."]

[SupercruiseExit]
# {body} = nearby body name
lines = ["Supercruise disengaged near {body}."]

[SupercruiseExit_nobdy]
# Used when no body is named.
lines = ["Supercruise disengaged."]

[StartJump_Hyperspace]
# No variables.
lines = ["Hyperspace jump engaged."]

[StartJump_Supercruise]
# No variables.
lines = ["Supercruise engaged."]

[HighGWarning]
# {g} = gravity formatted as "X.X G"
lines = ["Caution: {g} body ahead.", "High gravity warning: {g}."]

[HighGExtreme]
# {g} = gravity formatted as "X.X G"
lines = ["Extreme gravity alert! {g} — approach with extreme caution.", "Warning! Gravity exceeds safe threshold: {g}."]

[Docked]
# {station} = station name
lines = ["Docked at {station}."]

[Undocked]
# {station} = station name
lines = ["Undocked from {station}."]

[Undocked_nostation]
# Used when station name is unknown.
lines = ["Undocked."]

[DockingGranted]
# {pad} = landing pad number
lines = ["Docking request granted. Proceed to pad {pad}."]

[DockingDenied]
# {reason} = denial reason string
lines = ["Docking request denied. Reason: {reason}."]

[DockingCancelled]
# No variables.
lines = ["Docking aborted."]

[Touchdown]
# No variables.
lines = ["Touchdown."]

[Liftoff]
# No variables.
lines = ["Liftoff."]

[FirstFootfall]
# No variables.
lines = ["First footfall on this world!"]

# ── Combat ────────────────────────────────────────────────────────────────────

[UnderAttack]
# No variables.
lines = ["Warning! Under attack!"]

[UnderAttack_target]
# {target} = attacker name
lines = ["Warning! Under attack! Target: {target}."]

[ShieldDown]
# No variables.
lines = ["Warning! Shields offline!"]

[ShieldUp]
# No variables.
lines = ["Shields restored."]

[HullDamage_Critical]
# {pct} = hull percentage (integer)
lines = ["Critical! Hull at {pct} percent!"]

[HullDamage_Warning]
# {pct} = hull percentage (integer)
lines = ["Hull damage: {pct} percent."]

[Died]
# {msg} = full death message
lines = ["{msg}"]

[Bounty]
# {reward} = formatted credit string
lines = ["Bounty: {reward}."]

[Bounty_target]
# {reward} = formatted credit string
# {victim} = target name
lines = ["Bounty: {reward}. Target: {victim}."]

[FactionKillBond]
# {reward} = formatted credit string
lines = ["Combat bond: {reward}."]

[Interdicted_Submitted]
# No variables.
lines = ["Interdiction submitted."]

[Interdicted_Submitted_name]
# {interdictor} = NPC/player name
lines = ["Interdiction submitted to {interdictor}."]

[Interdicted_Escaped]
# No variables.
lines = ["Interdiction escaped!"]

[Interdicted_Escaped_name]
# {interdictor} = NPC/player name
lines = ["Interdiction escaped from {interdictor}!"]

[Interdiction_Success]
# {victim} = interdicted target name
lines = ["Interdiction successful: {victim}."]

[Interdiction_Failed]
# No variables.
lines = ["Interdiction failed."]

[Scanned]
# {scan_type} = type of scan detected
lines = ["Warning: {scan_type} scan detected!"]

[HeatWarning]
# No variables.
lines = ["Warning: Heat critical!"]

[HyperdictInterdict]
# No variables.
lines = ["Thargoid interdiction! Hyperdrive interrupted!"]

# ── Exploration ───────────────────────────────────────────────────────────────

[FSSDiscoveryScan]
# {total} = total bodies detected (integer)
lines = ["Honk complete. {total} bodies detected."]

[FSSAllBodiesFound]
# {system} = current system name
lines = ["System scan complete. All signals accounted for in {system}."]

[FSSSignalDiscovered]
# {sig} = signal name
lines = ["Signal detected: {sig}!"]

[Scan_Undiscovered]
# No variables.
lines = ["Undiscovered system."]

[Scan_Notable]
# {body_short} = short body name
# {detail}     = detail string (e.g. "Earthlike body. Landable. 3 bio signals")
lines = ["Notable: {body_short}. {detail}"]

[Scan_Detailed]
# {body_short} = short body name
# {detail}     = detail string
lines = ["Scan: {body_short}. {detail}"]

[SAAScanComplete]
# {body_short} = short body name
# {sig_txt}    = signal info e.g. " Signals: 2 bio." (empty string if none)
# {eff_txt}    = efficiency info e.g. " Efficiency target reached." (empty string if none)
lines = ["Mapped: {body_short}.{sig_txt}{eff_txt}"]

[CodexEntry]
# {name} = codex entry name
lines = ["Codex: {name}."]

[ScanOrganic_Log]
# {species} = species localised name
lines = ["Biological: {species}."]

[ScanOrganic_Log_NewSpecies]
# {species} = species localised name
lines = ["Biological: {species}. New species!"]

[ScanOrganic_Sample]
# {count}   = sample number (2 or 3)
# {species} = species localised name
lines = ["Bio sample {count} of 3: {species}."]

[ScanOrganic_Analyse]
# {species}   = species localised name
# {val_str}   = credit value formatted for speech
# {ff_suffix} = " First footfall bonus applied." or empty string
lines = ["Bio complete: {species}. Value: {val_str}.{ff_suffix}"]

[ScanOrganic_Analyse_BodyLeft]
# {body_left} = number of remaining bio signals on this body
# {bio_word}  = "bio" or "bios"
# {verb}      = "is" or "are"
lines = ["There {verb} {body_left} more {bio_word} on this body."]

[ScanOrganic_Analyse_SystemMore]
# {parts_str} = summary of remaining bios per body
lines = ["More bio signals: {parts_str}."]

[ScanOrganic_Analyse_SystemDone]
# No variables.
lines = ["All bio signals in this system are complete."]

# ── Missions ──────────────────────────────────────────────────────────────────

[MissionAccepted]
# {name} = mission name
lines = ["Mission accepted: {name}."]

[MissionCompleted]
# {name}   = mission name
# {reward} = credit reward formatted for speech
lines = ["Mission complete: {name}. Reward: {reward}."]

[MissionFailed]
# {name} = mission name
lines = ["Mission failed: {name}."]

# ── Economy & Trade ───────────────────────────────────────────────────────────

[MarketSell]
# {count}     = number of units sold
# {commodity} = commodity name
# {total}     = total sale value formatted for speech
lines = ["Sold: {count}x {commodity} for {total}."]

[MarketSell_profit]
# {count}     = number of units
# {commodity} = commodity name
# {total}     = total sale value formatted for speech
# {profit}    = profit formatted for speech
lines = ["Sold: {count}x {commodity} for {total}. Profit: {profit}."]

# ── Engineers ─────────────────────────────────────────────────────────────────

[EngineerUnlocked]
# {engineer} = engineer name
lines = ["Engineer unlocked: {engineer}!"]

[EngineerRank]
# {engineer} = engineer name
# {rank}     = new rank (integer)
lines = ["Engineer {engineer}: rank {rank}."]

# ── Status ────────────────────────────────────────────────────────────────────

[FuelScoop_Full]
# No variables.
lines = ["Fuel tank full."]

[EjectCargo]
# {cargo} = cargo type name
lines = ["Cargo ejected: {cargo}."]

[Repair]
# {item} = repaired item name
lines = ["Repair complete: {item}."]

[RepairAll]
# No variables.
lines = ["Full repair complete."]

[Resurrect]
# No variables.
lines = ["Respawned at station."]

