# NOVA Voicelines — English (built-in default)
# ─────────────────────────────────────────────
# THIS FILE IS REPLACED ON EVERY NOVA UPDATE — do not edit it directly.
#
# To customise voicelines, create:
#   ~/.config/nova/voicelines/en.toml
#
# User file format  (add or replace lines per event):
#
#   [EventKey]
#   add     = ["Extra variant 1.", "Extra variant 2."]
#   # OR
#   replace = ["Only this.", "Or this."]
#
#   add     — appends your lines to the built-in pool (more random variety)
#   replace — uses only your lines for this event (overrides the default)
#   replace = []  — silences the event completely
#
# Variables in {curly_braces} are filled at runtime; see each event below.
#
# Shared variable groups available in many events:
#
#   Ship:   {commander} {ship} {ship_type} {ship_name} {ship_ident}
#           {hull} {hull_raw} {fuel} {fuel_raw} {fuel_max_raw}
#           {jump_range} {jump_range_raw}
#
#   System: {system} {allegiance} {economy} {security} {government}
#           {population} {population_raw} {faction}
#
#   Body:   {body_type} {atmosphere} {volcanism} {gravity} {gravity_raw}
#           {temp} {temp_raw} {radius} {radius_raw} {mass} {mass_raw}
#           {dist_ls} {dist_ls_raw} {value} {value_raw}
#           {is_terraformable} (True/False)  {is_scoopable} (True/False)
#           {landable} {bio_count} {geo_count}
#           {first_disc} {first_footfall_flag}
#
#   System: {is_star_scoopable} (True/False)
#
#   Bio scan (active scan): {genus} {sample_count} {samples_left}
#           {min_dist} {min_dist_raw} {bio_value} {bio_value_raw}
#           {body_bio_total} {body_bio_complete}
#           {body_bio_remaining_count} {body_bio_remaining_species}
#
#   Bio system: {bio_system_remaining_count} {bio_system_remaining_bodies}
#               {bio_system_complete_count} {bio_system_done}
#               {bio_system_total_value} {bio_system_total_value_raw}
#
#   Notable bodies (FSSAllBodiesFound):
#           {notable_count} {elw_count} {ww_count} {aw_count} {tf_count}
#           {bio_body_count} {neutron_count} {black_hole_count}
#           {high_value_count} {notable_summary}
#           {total_scan_value} {total_scan_value_raw}
#
# ── Template Engine Features ──────────────────────────────────────────────────
#
# INCLUDES — reusable phrase fragments (define in your user en.toml file)
#
#   Fragment key must start with _; it is never spoken directly.
#
#     [_ship_status]
#     add = ["{ship_name} — hull {hull}, fuel {fuel}."]
#
#   Two equivalent syntaxes to include it:
#
#     [FSDJump]
#     add = ["Arrived in {system}. {include:_ship_status}"]   # explicit
#     add = ["Arrived in {system}. {_ship_status}"]           # shorthand
#
#   Shorthand {_KeyName} supports letters, digits, underscores only.
#   Use {include:_key-name} (explicit) for keys that contain hyphens.
#   Missing keys expand to "". Circular includes capped at depth 5.
#
# CONDITIONALS — inline WHEN...THEN blocks
#
#   WHEN condition THEN "text"; — the block is replaced with "text" when the
#   condition is true, or with "" when false. The ; terminator is optional at
#   end of string.
#
#     [Scan_Notable]
#     add = ['Scanned {body_short}. WHEN {value_raw} > 500000 THEN "Worth {value}."; WHEN {bio_count} > 0 THEN "{bio_count} bio signals.";']
#
#   Supported operators:
#     IS TRUE / IS FALSE / IS NOT TRUE
#     == != < > <= >=
#     AND   OR
#
#   Truthy: non-empty value that is not "0" or "false" (case-insensitive).
#   Boolean variables ({is_scoopable}, {is_terraformable}) return Python True/False.
#   Use "WHEN {is_scoopable} IS TRUE THEN ..." or "WHEN {is_terraformable} IS FALSE THEN ...".
#   Deprecated aliases ({terra}, {scoopable}, {star_scoopable}) still work for one release.
#   Other flag variables ({landable}, {first_disc} etc.) are "" when absent,
#   non-empty when present — so "WHEN {landable} IS TRUE" works naturally.

# ── Startup / Shutdown ────────────────────────────────────────────────────────

[Nova_Startup]
# No variables.
lines = ["NOVA active."]

[Shutdown]
# Ship vars + System vars available.
lines = ["Systems powering down. Farewell, Commander."]

# ── Login ─────────────────────────────────────────────────────────────────────

[LoadGame]
# Ship vars available: {commander} {ship} {ship_type} {hull} {fuel} {jump_range} ...
lines = ["Commander {commander} online."]

# ── Navigation ────────────────────────────────────────────────────────────────

[FSDJump]
# {system}         = destination star system name
# {dist_ly}        = jump distance formatted for speech (e.g. "12.3 light years")
# {dist_ly_raw}    = raw distance as decimal string
# {hops_remaining} = hops left in route (string)
# {suffix}         = optional extra info appended (star class, hops remaining, population)
# System vars + Ship vars also available.
lines = ["Arrived in {system}. Jump {dist_ly}.{suffix}"]

[NavRoute]
# {dest}         = destination system name
# {hops}         = number of jumps (string)
# {hops_word}    = "jump" or "jumps"
# {dist_ly}      = total route distance formatted for speech
# {dist_ly_raw}  = raw distance as decimal string
# System vars also available.
lines = ["Route set. Destination: {dest}. {hops} {hops_word}."]

[NavRouteClear]
# No variables.
lines = ["Route cleared."]

[SupercruiseEntry]
# System vars + Ship vars available.
lines = ["Supercruise engaged."]

[SupercruiseExit]
# {body}  = nearby body name
# System vars + Body vars also available.
lines = ["Supercruise disengaged near {body}."]

[SupercruiseExit_nobdy]
# Used when no body is named. System vars available.
lines = ["Supercruise disengaged."]

[StartJump_Hyperspace]
# No variables.
lines = ["Hyperspace jump engaged."]

[StartJump_Supercruise]
# No variables.
lines = ["Supercruise engaged."]

[HighGWarning]
# {g}      = gravity formatted as "X.X G"
# {g_raw}  = raw gravity value as decimal string
# {body}   = body name
# Body vars also available.
lines = ["Caution: {g} body ahead.", "High gravity warning: {g}."]

[HighGExtreme]
# {g}      = gravity formatted as "X.X G"
# {g_raw}  = raw gravity value as decimal string
# {body}   = body name
# Body vars also available.
lines = ["Extreme gravity alert! {g} — approach with extreme caution.", "Warning! Gravity exceeds safe threshold: {g}."]

[Docked]
# {station}      = station name
# {station_type} = station type string
# System vars + Ship vars also available.
lines = ["Docked at {station}."]

[Undocked]
# {station} = station name
# System vars + Ship vars also available.
lines = ["Undocked from {station}."]

[Undocked_nostation]
# Used when station name is unknown. System vars + Ship vars available.
lines = ["Undocked."]

[DockingGranted]
# {pad}     = landing pad number
# {station} = station name
# System vars also available.
lines = ["Docking request granted. Proceed to pad {pad}."]

[DockingDenied]
# {reason} = denial reason string
lines = ["Docking request denied. Reason: {reason}."]

[DockingCancelled]
# No variables.
lines = ["Docking aborted."]

[Touchdown]
# {body} = body name
# {lat}  = latitude (string)
# {lon}  = longitude (string)
# Body vars + System vars also available.
lines = ["Touchdown."]

[Liftoff]
# {body} = body name
# Body vars + System vars also available.
lines = ["Liftoff."]

[FirstFootfall]
# {body} = body name
# Body vars + System vars also available.
lines = ["First footfall on this world!"]

# ── Combat ────────────────────────────────────────────────────────────────────

[UnderAttack]
# No variables.
lines = ["Warning! Under attack!"]

[UnderAttack_target]
# {attacker} = attacker name, {ship_type} = attacker ship type
lines = ["Warning! Under attack! Attacker: {attacker}WHEN {ship_type} IS TRUE THEN \" ({ship_type})\";."]

[ShieldDown]
# Ship vars + System vars available.
lines = ["Warning! Shields offline!"]

[ShieldUp]
# Ship vars + System vars available.
lines = ["Shields restored."]

[HullDamage_Critical]
# {pct}     = hull percentage (integer)
# Ship vars also available: {hull} {hull_raw} {ship} ...
lines = ["Critical! Hull at {pct} percent!"]

[HullDamage_Warning]
# {pct}     = hull percentage (integer)
# Ship vars also available: {hull} {hull_raw} {ship} ...
lines = ["Hull damage: {pct} percent."]

[Died]
# {msg} = full death message
# Ship vars + System vars also available.
lines = ["{msg}"]

[Bounty]
# {reward} = formatted credit string
lines = ["Bounty: {reward}."]

[Bounty_target]
# {reward} = formatted credit string
# {victim} = target name
lines = ["Bounty: {reward}. Target: {victim}."]

[FactionKillBond]
# {reward} = formatted credit string
lines = ["Combat bond: {reward}."]

[Interdicted_Submitted]
# No variables.
lines = ["Interdiction submitted."]

[Interdicted_Submitted_name]
# {interdictor} = NPC/player name
lines = ["Interdiction submitted to {interdictor}."]

[Interdicted_Escaped]
# No variables.
lines = ["Interdiction escaped!"]

[Interdicted_Escaped_name]
# {interdictor} = NPC/player name
lines = ["Interdiction escaped from {interdictor}!"]

[Interdiction_Success]
# {victim} = interdicted target name
lines = ["Interdiction successful: {victim}."]

[Interdiction_Failed]
# No variables.
lines = ["Interdiction failed."]

[Scanned]
# {scan_type} = type of scan detected
lines = ["Warning: {scan_type} scan detected!"]

[HeatWarning]
# No variables.
lines = ["Warning: Heat critical!"]

[HyperdictInterdict]
# No variables.
lines = ["Thargoid interdiction! Hyperdrive interrupted!"]

# ── Exploration ───────────────────────────────────────────────────────────────

[FSSDiscoveryScan]
# {total}   = total bodies detected (integer string)
# System vars also available.
lines = ["Honk complete. {total} bodies detected."]

[FSSAllBodiesFound]
# {system}  = current system name
# Notable bodies vars available: {notable_count} {elw_count} {ww_count} {aw_count}
#   {tf_count} {bio_body_count} {neutron_count} {black_hole_count} {high_value_count}
#   {notable_summary} {total_scan_value} {total_scan_value_raw}
# System vars also available.
lines = ["System scan complete. All signals accounted for in {system}."]

[FSSSignalDiscovered]
# {sig} = signal name
lines = ["Signal detected: {sig}!"]

[Scan_Undiscovered]
# System vars available: {system} {allegiance} {economy} {security} {government}
#   {population} {population_raw} {faction}
lines = ["Undiscovered system."]

[Scan_Notable]
# {body_short} = short body name (suffix only)
# {body}       = full body name
# {detail}     = detail string (e.g. "Earthlike body. Landable. 3 bio signals")
# Body vars + System vars also available.
lines = ["Notable: {body_short}. {detail}"]

[Scan_Detailed]
# {body_short} = short body name (suffix only)
# {body}       = full body name
# {detail}     = detail string
# Body vars + System vars also available.
lines = ["Scan: {body_short}. {detail}"]

[SAAScanComplete]
# {body_short} = short body name (suffix only)
# {body}       = full body name
# {sig_txt}    = signal info e.g. " Signals: 2 bio." (empty string if none)
# {eff_txt}    = efficiency info e.g. " Efficiency target reached." (empty string if none)
# {map_txt}    = mapping value info e.g. " Mapped value: 1.2 million credits."
# Body vars + System vars also available.
lines = ["Mapped: {body_short}.{sig_txt}{eff_txt}"]

[CodexEntry]
# {name} = codex entry name
lines = ["Codex: {name}."]

[ScanOrganic_Log]
# {species} = species localised name
# {body}    = body name
# Bio scan vars + Body vars + Bio system vars also available.
lines = ["Biological: {species}."]

[ScanOrganic_Log_NewSpecies]
# {species} = species localised name
# {body}    = body name
# Bio scan vars + Body vars + Bio system vars also available.
lines = ["Biological: {species}. New species!"]

[ScanOrganic_Sample]
# {count}   = sample number (2 or 3)
# {species} = species localised name
# {body}    = body name
# Bio scan vars + Body vars + Bio system vars also available.
lines = ["Bio sample {count} of 3: {species}."]

[ScanOrganic_Analyse]
# {species}   = species localised name
# {val_str}   = credit value formatted for speech
# {ff_suffix} = " First footfall bonus applied." or empty string
# {body}      = body name
# Bio scan vars + Body vars + Bio system vars also available.
lines = ["Bio complete: {species}. Value: {val_str}.{ff_suffix}"]

[ScanOrganic_Analyse_BodyLeft]
# {body_left} = number of remaining bio signals on this body (string)
# {bio_word}  = "bio" or "bios"
# {verb}      = "is" or "are"
# {body}      = body name
# Bio system vars also available.
lines = ["There {verb} {body_left} more {bio_word} on this body."]

[ScanOrganic_Analyse_SystemMore]
# {parts_str} = summary of remaining bios per body (e.g. "2 on Proxima A 1, 1 on Proxima A 2")
# Bio system vars also available.
lines = ["More bio signals: {parts_str}."]

[ScanOrganic_Analyse_SystemDone]
# Bio system vars available: {bio_system_complete_count} {bio_system_total_value} ...
lines = ["All bio signals in this system are complete."]

# ── Missions ──────────────────────────────────────────────────────────────────

[MissionAccepted]
# {name} = mission name
# {dest} = destination (system / station)
# System vars also available.
lines = ["Mission accepted: {name}."]

[MissionCompleted]
# {name}   = mission name
# {reward} = credit reward formatted for speech
# System vars also available.
lines = ["Mission complete: {name}. Reward: {reward}."]

[MissionFailed]
# {name} = mission name
lines = ["Mission failed: {name}."]

# ── Economy & Trade ───────────────────────────────────────────────────────────

[MarketSell]
# {count}     = number of units sold
# {commodity} = commodity name
# {total}     = total sale value formatted for speech
lines = ["Sold: {count}x {commodity} for {total}."]

[MarketSell_profit]
# {count}     = number of units
# {commodity} = commodity name
# {total}     = total sale value formatted for speech
# {profit}    = profit formatted for speech
lines = ["Sold: {count}x {commodity} for {total}. Profit: {profit}."]

# ── Engineers ─────────────────────────────────────────────────────────────────

[EngineerUnlocked]
# {engineer} = engineer name
lines = ["Engineer unlocked: {engineer}!"]

[EngineerRank]
# {engineer} = engineer name
# {rank}     = new rank (integer)
lines = ["Engineer {engineer}: rank {rank}."]

# ── Status ────────────────────────────────────────────────────────────────────

[FuelScoop_Full]
# Ship vars available: {fuel} {fuel_raw} {fuel_max_raw} {ship} ...
lines = ["Fuel tank full."]

[EjectCargo]
# {cargo} = cargo type name
lines = ["Cargo ejected: {cargo}."]

[Repair]
# {item} = repaired item name
lines = ["Repair complete: {item}."]

[RepairAll]
# No variables.
lines = ["Full repair complete."]

[Resurrect]
# No variables.
lines = ["Respawned at station."]

# ── Ship Status / COVAS Callouts ──────────────────────────────────────────────

[LandingGear_Deployed]
lines = ["Landing gear deployed."]

[LandingGear_Retracted]
lines = ["Landing gear retracted."]

[CargoScoop_Deployed]
lines = ["Cargo scoop deployed."]

[CargoScoop_Retracted]
lines = ["Cargo scoop retracted."]

[Hardpoints_Deployed]
lines = ["Hardpoints deployed."]

[Hardpoints_Retracted]
lines = ["Hardpoints retracted."]

[Lights_On]
lines = ["Lights on."]

[Lights_Off]
lines = ["Lights off."]

[NightVision_On]
lines = ["Night vision enabled."]

[NightVision_Off]
lines = ["Night vision disabled."]

[FlightAssist_Off]
lines = ["Flight assist off."]

[FlightAssist_On]
lines = ["Flight assist on."]

[SilentRunning_On]
lines = ["Silent running enabled."]

[SilentRunning_Off]
lines = ["Silent running disabled."]

[AnalysisMode]
lines = ["Analysis mode."]

[CombatMode]
lines = ["Combat mode."]

[SRV_Deployed]
lines = ["S R V deployed."]

[SRV_Secured]
lines = ["S R V secured."]

[SRV_Boarded]
lines = ["S R V boarded."]

[SRV_Exited]
lines = ["S R V exited."]

[MassLocked]
lines = ["Mass locked."]

[MassLockReleased]
lines = ["Mass lock released."]

[BioReady]
# {species}  = species localised name
# Bio scan vars + Body vars also available.
lines = ["{species} ready. You may scan the next sample."]

[BioTooClose]
# {species}  = species localised name
# Bio scan vars + Body vars also available.
# Fired when the player re-enters the exclusion zone around a previous sample.
lines = ["Too close to {species} sample. Move away before scanning."]

[SellExplorationData]
# {value}   = credit value formatted for speech
# System vars also available.
lines = ["Exploration data sold: {value}."]

[System_EDSM_Unknown]
# No variables.
lines = ["System unknown to EDSM."]
