lines = ["Landing gear deployed."]

[LandingGear_Retracted]
lines = ["Landing gear retracted."]

[CargoScoop_Deployed]
lines = ["Cargo scoop deployed."]

[CargoScoop_Retracted]
lines = ["Cargo scoop retracted."]

[Hardpoints_Deployed]
lines = ["Hardpoints deployed."]

[Hardpoints_Retracted]
lines = ["Hardpoints retracted."]

[Lights_On]
lines = ["Lights on."]

[Lights_Off]
lines = ["Lights off."]

[NightVision_On]
lines = ["Night vision enabled."]

[NightVision_Off]
lines = ["Night vision disabled."]

[FlightAssist_Off]
lines = ["Flight assist off."]

[FlightAssist_On]
lines = ["Flight assist on."]

[SilentRunning_On]
lines = ["Silent running enabled."]

[SilentRunning_Off]
lines = ["Silent running disabled."]

[AnalysisMode]
lines = ["Analysis mode."]

[CombatMode]
lines = ["Combat mode."]

[SRV_Deployed]
lines = ["S R V deployed."]

[SRV_Secured]
lines = ["S R V secured."]

[SRV_Boarded]
lines = ["S R V boarded."]

[SRV_Exited]
lines = ["S R V exited."]

[MassLocked]
lines = ["Mass locked."]

[MassLockReleased]
lines = ["Mass lock released."]

[BioReady]
# {species} = species name
lines = ["{species} ready. You may scan the next sample."]

[BioTooClose]
