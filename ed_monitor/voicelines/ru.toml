# NOVA Voicelines — Русский (встроенный стандарт)
# ──────────────────────────────────────────────
# У каждого события ровно одна строка. Чтобы добавить варианты или заменить
# событие, создайте ~/.config/nova/voicelines/ru.toml только с теми
# событиями, которые хотите изменить.
# Переменные в {фигурных_скобках} заменяются во время выполнения.

[Nova_Startup]
lines = ["NOVA активна."]

[Shutdown]
lines = ["Системы отключаются. До свидания, Командир."]

[LoadGame]
lines = ["Командир {commander} в сети."]

[FSDJump]
lines = ["Прибыли в {system}. Прыжок {dist_ly}.{suffix}"]

[NavRoute]
lines = ["Маршрут проложен. Назначение: {dest}. {hops} {hops_word}."]

[NavRouteClear]
lines = ["Маршрут очищен."]

[SupercruiseEntry]
lines = ["Сверхкруиз активирован."]

[SupercruiseExit]
lines = ["Сверхкруиз деактивирован вблизи {body}."]

[SupercruiseExit_nobdy]
lines = ["Сверхкруиз деактивирован."]

[StartJump_Hyperspace]
lines = ["Гиперпространственный прыжок активирован."]

[StartJump_Supercruise]
