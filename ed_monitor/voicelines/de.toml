# NOVA Voicelines — Deutsch (eingebauter Standard)
# ─────────────────────────────────────────────────
# Jedes Ereignis hat genau eine Zeile. Um Varianten hinzuzufügen oder ein
# Ereignis zu überschreiben, erstelle ~/.config/nova/voicelines/de.toml
# mit nur den Ereignissen, die du ändern möchtest.
# Variablen in {geschweiften_Klammern} werden zur Laufzeit ersetzt.

# ── Start / Herunterfahren ────────────────────────────────────────────────────

[Nova_Startup]
lines = ["NOVA aktiv."]

[Shutdown]
lines = ["Systeme werden heruntergefahren. Auf Wiedersehen, Commander."]

# ── Anmeldung ─────────────────────────────────────────────────────────────────

[LoadGame]
lines = ["Commander {commander} online."]

# ── Navigation ────────────────────────────────────────────────────────────────

[FSDJump]
lines = ["Ankunft in {system}. Sprung {dist_ly}.{suffix}"]

[NavRoute]
lines = ["Route gesetzt. Ziel: {dest}. {hops} {hops_word}."]

[NavRouteClear]
lines = ["Route gelöscht."]

[SupercruiseEntry]
lines = ["Überlicht aktiviert."]

[SupercruiseExit]
lines = ["Überlicht bei {body} deaktiviert."]

[SupercruiseExit_nobdy]
lines = ["Überlicht deaktiviert."]

[StartJump_Hyperspace]
lines = ["Hyperraumsprung eingeleitet."]

[StartJump_Supercruise]
lines = ["Überlicht aktiviert."]

[Docked]
lines = ["Angedockt an {station}."]

[Undocked]
lines = ["Von {station} abgedockt."]

[Undocked_nostation]
lines = ["Abgedockt."]

[DockingGranted]
lines = ["Andockgenehmigung erteilt. Bitte zu Pad {pad} navigieren."]

[DockingDenied]
