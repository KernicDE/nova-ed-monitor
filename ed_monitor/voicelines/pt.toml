# NOVA Voicelines — Português (padrão integrado)
# ────────────────────────────────────────────────
# Cada evento tem exatamente uma linha. Para adicionar variantes ou substituir
# um evento, crie ~/.config/nova/voicelines/pt.toml com apenas os eventos
# que pretende alterar.
# As variáveis em {chavetas} são substituídas em tempo de execução.

[Nova_Startup]
lines = ["NOVA ativa."]

[Shutdown]
