name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pyinstaller

      - name: Install project dependencies
        run: pip install -e ".[pygame]"

      - name: Build Python distribution (sdist + wheel)
        run: python -m build

      - name: Build Linux standalone binary
        run: |
          printf 'from ed_monitor.__main__ import main\nmain()\n' > _nova_entry.py
          pyinstaller \
            --onefile \
            --name nova \
            --collect-all textual \
            --collect-all edge_tts \
            --hidden-import pygame \
            --hidden-import httpx \
            _nova_entry.py
          mv dist/nova dist/nova-linux-x86_64

      - name: Extract release notes from annotated tag
        run: |
          NOTES=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" 2>/dev/null | grep -v "^Co-Authored-By:")
          if [ -n "$NOTES" ]; then
            echo "$NOTES" > /tmp/release_notes.md
          else
            echo "No release notes provided." > /tmp/release_notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/nova-linux-x86_64
            nova.sh
            nova.ps1
            nova.bat
            install_windows.bat
          body_path: /tmp/release_notes.md
